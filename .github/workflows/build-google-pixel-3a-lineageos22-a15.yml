name: Build Camellia (MT6833) - Kernel Only

on:
workflow_dispatch:

env:
DEVICE_NAME: "camellia"
DEVICE_CODENAME: "camellia"

CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
EXTRA_CMDS: "LD=ld.lld"

Kernel Source

KERNEL_SOURCE: "https://github.com/Vikram5fbd009/Overclock_mt6833"
KERNEL_BRANCH: "flyme"

Toolchain

CLANG_SOURCE: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"
CLANG_BRANCH: "master-kernel-build-2022"

GCC_GNU: true
GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
GCC_64_BRANCH: "android12L-release"
GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
GCC_32_BRANCH: "android12L-release"

Config

DEFCONFIG_SOURCE: ""
DEFCONFIG_NAME: "camellia_defconfig"
DEFCONFIG_ORIGIN_IMAGE: ""
DEFCONFIG_FROM_BOOT: false

Disable KernelSU and SUSFS patching

KERNELSU_SOURCE: ""
KERNELSU_BRANCH: ""
KERNELSU_AUTO_GET: "false"
KERNELSU_AUTO_FORK: ""

SUSFS_ENABLE: false
SUSFS_FIXED: false

Packaging

AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
AK3_BRANCH: "master"
BOOT_SOURCE: ""
NEED_DTBO: false
NEED_SAFE_DTBO: false
ROM_TEXT: "flyme"

PYTHON_VERSION: "3"
PACK_METHOD: "AnyKernel3"
PACK_KMODULES: "false"
KERNELSU_METHOD: "shell"

Disable all additional patches

REKERNEL_ENABLE: "false"
DROIDSPACES_ENABLE: "false"
NOMOUNT_ENABLE: "false"
HOOK_METHOD: "manual"

KPM_ENABLE: "false"
KPM_INLINE: "false"
KPM_KPATCH_NEXT: "false"

BASEBAND_GUARD_ENABLE: "false"
BASEBAND_GUARD_BOOT: "false"

GENERATE_DTB: "false"
GENERATE_CHIP: "mediatek"

BUILD_DEBUGGER: "false"
SKIP_PATCH: "true"
BUILD_OTHER_CONFIG: "false"
MERGE_CONFIG_FILES: ""
FREE_MORE_SPACE: "false"

jobs:
build-kernel:
name: Build Camellia Kernel Only
runs-on: ubuntu-22.04

env:
  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_NOHASHDIR: "true"
  CCACHE_HARDLINK: "true"

steps:
  - name: Checkout workflow repository
    uses: actions/checkout@v4

  - name: Prepare compilation environment
    uses: ./.github/workflows/build-env

  - name: Get necessary tools
    uses: ./.github/workflows/build-ready

  - name: Build kernel
    uses: ./.github/workflows/build-process

  - name: Package kernel
    uses: ./.github/workflows/pack-process

  - name: Upload kernel artifacts
    uses: ./.github/workflows/upload-files
