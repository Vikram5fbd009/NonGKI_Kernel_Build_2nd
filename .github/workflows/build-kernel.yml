name: Build Kernel (Camellia)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-kernel:
    name: Build Camellia (MT6833)
    runs-on: ubuntu-22.04

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Set Swap Space (16GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: ⚙️ Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf \
          build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev \
          squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng \
          maven libssl-dev pwgen minicom bc libx11-dev libgl1-mesa-dev xsltproc \
          unzip device-tree-compiler python3 binutils-aarch64-linux-gnu

      - name: ☁️ Download Toolchain & Fix Symlinks
        run: |
          # Clang
          mkdir -p $GITHUB_WORKSPACE/toolchain/clang
          wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" -O clang.tar.gz
          tar -C $GITHUB_WORKSPACE/toolchain/clang -zxf clang.tar.gz
          
          # GCC 64-bit
          mkdir -p $GITHUB_WORKSPACE/toolchain/gcc-64
          wget -q "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz" -O gcc64.tar.gz
          tar -C $GITHUB_WORKSPACE/toolchain/gcc-64 -zxf gcc64.tar.gz
          
          # GCC 32-bit
          mkdir -p $GITHUB_WORKSPACE/toolchain/gcc-32
          wget -q "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz" -O gcc32.tar.gz
          tar -C $GITHUB_WORKSPACE/toolchain/gcc-32 -zxf gcc32.tar.gz
          
          rm *.tar.gz
          
          # Symlinks ताकि क्लैंग को gnu असेंबलर मिल सके
          cd $GITHUB_WORKSPACE/toolchain/gcc-64/bin
          for f in aarch64-linux-android-*; do ln -sf "$f" "${f/aarch64-linux-android-/aarch64-linux-gnu-}"; done
          cd $GITHUB_WORKSPACE/toolchain/gcc-32/bin
          for f in arm-linux-androideabi-*; do ln -sf "$f" "${f/arm-linux-androideabi-/arm-linux-gnueabi-}"; done
          
          echo "✅ Toolchain Downloaded & Symlinks Fixed!"

      - name: 📥 Clone Kernel Source
        run: |
          # अब यहाँ main ब्रांच है
          git clone --depth=1 -b main https://github.com/Vikram5fbd009/Mt6833_original.git kernel_source

      - name: 🚀 Compile Kernel (Capture Logs)
        run: |
          cd kernel_source
          set +e
          
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc-64/bin:$GITHUB_WORKSPACE/toolchain/gcc-32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          echo ">>> Generating Defconfig..."
          make O=out ARCH=arm64 camellia_defconfig 2>&1 | tee build.log
          
          echo ">>> Compiling Kernel..."
          # यहाँ से LLVM_IAS=1 हटा दिया गया है ताकि VDSO वाली एरर न आए
          make -k -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error -Wno-unknown-warning-option -Wno-implicit-function-declaration -Wno-unused-but-set-variable -Wno-incompatible-pointer-types -Wno-int-conversion -Wno-return-type" \
            2>&1 | tee -a build.log
          
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          
          echo "=================================================" > errors.txt
          echo "   EXTRACTED ERRORS FROM BUILD LOG" >> errors.txt
          echo "=================================================" >> errors.txt
          grep -iE "error:|fatal error|undefined reference|No rule to make target|extraneous text|unrecognized option|Only one 'else'" build.log >> errors.txt || true
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ Build Failed! Check the uploaded artifacts for logs."
            exit 1
          fi

      - name: 📦 Package with AnyKernel3 (Only if build succeeds)
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git -b master anykernel
          cp kernel_source/out/arch/arm64/boot/Image.gz-dtb anykernel/
          cd anykernel
          zip -r ../Camellia-Kernel.zip . -x "*.git*"

      - name: ✏️ Upload Artifacts (Logs & Kernel)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Camellia-Build-Output
          path: |
            kernel_source/build.log
            kernel_source/errors.txt
            Camellia-Kernel.zip
          retention-days: 7
